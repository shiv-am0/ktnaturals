{% extends 'owner/base.html' %}{% block owner_content %}<div class="section-heading"><div><p class="eyebrow">YOUR CATALOGUE</p><h1>Products</h1></div><a class="button" href="{% url 'owner_product_new' %}">+ Add product</a></div><div class="panel">{% for p in products %}<div class="owner-row"><a href="{% url 'owner_product' p.pk %}"><strong>{{ p.name }}</strong><br><span>{{ p.price_display }}</span></a><span class="status">{{ p.get_status_display }}</span><a href="{% url 'owner_product' p.pk %}">Edit →</a></div>{% empty %}<p>No products yet. Start with a draft.</p>{% endfor %}</div>{% endblock %}
