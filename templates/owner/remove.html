{% extends 'owner/base.html' %}{% block owner_content %}<section class="panel"><h1>Remove this item?</h1><p>This removes the selected {{ kind }} item from {{ product.name }}. This action cannot be undone from the editor.</p>{% if error %}<p class="errorlist" role="alert">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<button>Confirm removal</button> <a href="{% url 'owner_product' product.pk %}">Cancel</a></form></section>{% endblock %}
