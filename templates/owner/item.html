{% extends 'owner/base.html' %}{% block owner_content %}<a href="{% url 'owner_product' product.pk %}">← Back to {{ product.name }}</a><h1>{% if item.pk %}Edit{% else %}Add{% endif %} {{ kind }}</h1><form method="post" enctype="multipart/form-data" class="panel owner-form">{% csrf_token %}<input type="hidden" name="revision" value="{{ revision }}">{% if item.image %}<img class="edit-preview" src="{{ item.image.url }}" alt="{{ item.alt_text }}">{% endif %}{{ form.as_p }}<button>Save {{ kind }}</button></form>{% endblock %}
